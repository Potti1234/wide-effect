# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: wide-effect-no-dynamic-observability-name
language: tsx
severity: error
message: "Use a static observability event or operation name; move changing values into attributes"

rule:
  any:
    - all:
        - pattern: event($NAME, $$$REST)
        - has: { kind: template_substitution, stopBy: end }
    - pattern: event($LEFT + $RIGHT, $$$REST)
    - all:
        - pattern: withWideSpan($NAME)
        - has: { kind: template_substitution, stopBy: end }
    - pattern: withWideSpan($LEFT + $RIGHT)
    - all:
        - pattern: withWideSpan($NAME, $OPTIONS)
        - has: { kind: template_substitution, stopBy: end }
    - pattern: withWideSpan($LEFT + $RIGHT, $OPTIONS)
    - all:
        - pattern: Effect.withSpan($EFFECT, $NAME)
        - has: { kind: template_substitution, stopBy: end }
    - pattern: Effect.withSpan($EFFECT, $LEFT + $RIGHT)
    - all:
        - pattern: Effect.withSpan($EFFECT, $NAME, $OPTIONS)
        - has: { kind: template_substitution, stopBy: end }
    - pattern: Effect.withSpan($EFFECT, $LEFT + $RIGHT, $OPTIONS)

note: |
  Prefer `event("worker.claimed", { runId })` or
  `effect.pipe(withWideSpan("worker.run.claim"))`. Static names make events
  groupable; dynamic values belong in redacted attributes.
